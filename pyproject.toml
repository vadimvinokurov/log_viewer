[project]
name = "log-viewer"
version = "2.0.0"
description = "Log viewer with filtering, highlighting, and search"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyperclip>=1.8",
    "pyyaml>=6.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
log-viewer = "log_viewer.gui.app:main"

[build-system]
requires = ["setuptools>=68.0", "Cython>=3.0", "numpy>=1.26"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "cython>=3.0",
    "psutil>=7.2.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-qt>=4.4",
]
